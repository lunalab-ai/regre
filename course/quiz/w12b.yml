source: course/notion/w12b/w12b-workbook.md
provenance: W12B 수업용 형성문제 6개.
items:
- question: 평균이 0인 두 구간의 잔차 폭은 서로 다를 수 있나요?
  answer: 그렇습니다. 같은 평균 주위에 점이 멀거나 가깝게 모일 수 있습니다.
- question: 포아송 평균이 네 배면 원 건수의 표준편차는 어떻게 바뀌나요?
  answer: 두 배가 됩니다. 포아송의 원 단위 표준편차는 평균의 제곱근입니다.
- question: 오차 표준편차가 X에 비례하면 WLS 가중치는 X의 몇 제곱에 반비례하나요?
  answer: 2제곱입니다. 분산이 X의 제곱에 비례하고 가중치는 그 분산의 역수에 비례합니다.
- question: 변환식 Y/X의 절편은 원래 회귀식의 어느 계수인가요?
  answer: 원래 식에서 X의 기울기입니다. 식의 양변에 X를 곱해 확인할 수 있습니다.
- question: 로그 반응과 원래 반응을 적합한 두 모형은 어느 척도로 되돌려 적합 RMSE를 비교하나요?
  answer: 같은 관측 행을 대상으로 원래 Y 단위의 관측값과 원 단위로 표시한 적합값을 비교합니다.
- question: 멱변환의 사다리에서 0을 고르면 어떤 변환을 적용하나요?
  answer: 양수에 대해 로그를 고르는 관례입니다.
