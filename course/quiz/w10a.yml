title: W10A · 개념을 말로 확인하기
provenance: 개념 카드의 Q01–Q10 원문에 대응하는 공개 개념 해설입니다. 독립 연습 L01–L12의 완성 풀이와 구별합니다.
source: course/notion/w10a/w10a-concept-cards.md
items:
- id: Q01
  question: x를 고정하고 y만 바꿀 때 h는 바뀌나요?
  answer: 바뀌지 않습니다. 고정한 설계행렬 X가 h를 결정합니다. y 변화에 자기 적합값이 얼마나 반응하는지를 나타내며 오류 확률이 아닙니다.
- id: Q02
  question: 외적 표준화잔차에서 삭제 후 다시 추정하는 것은 무엇인가요?
  answer: 해당 관측을 제외한 오차규모 s_(i)입니다. 원래 e_i와 h_i를 사용하는 분자/설계와 삭제 후 분산 추정을 구별합니다.
- id: Q03
  question: 정규 Q-Q의 가로축은 무엇인가요?
  answer: 정규분포의 이론 분위수입니다. 세로는 정렬 잔차입니다. x 설명변수, 확률 p, 원래 수집순서 번호가 아닙니다.
- id: Q04
  question: 잔차–수집순서 플롯을 그리기 전에 확인할 정보는 무엇인가요?
  answer: 실제 기록순서 또는 측정시간 메타데이터입니다. 임의 ID나 Hills의 반응변수 Time을 수집순서로 대체하지 않습니다.
- id: Q05
  question: Cook의 정의는 어느 위치들의 예측 변화량을 모으나요?
  answer: 원래 모든 관측 위치 j의 전체/삭제 적합값 변화 제곱을 합하고 k s²로 나눕니다. 자기 위치만 보는 DFFITS와 구별합니다.
- id: Q06
  question: 이 교재 P-R 플롯의 가로축과 세로축은 무엇인가요?
  answer: 가로 Hadi 잔차성분 R, 세로 잠재성 P입니다. R은 제곱에 기반하여 원래 잔차 부호를 잃고 P는 확률이 아닙니다.
- id: Q07
  question: AV 플롯에서 잔차화하는 것은 어느 축인가요?
  answer: 양쪽입니다. y와 관심 x를 같은 다른 설명변수와 절편에 각각 회귀한 잔차를 그립니다. 원래 x를 쓰는 성분잔차와 다릅니다.
- id: Q08
  question: Huber 가중치가1이면 높은 지레점이 아니라고 확정할 수 있나요?
  answer: 확정할 수 없습니다. Huber 가중치는 표준화 잔차에 기반하며 높은 h에서도 잔차가 작으면 가중치가1일 수 있습니다.
- id: Q09
  question: 학력 세 범주를 절편과 함께 표현할 때 필요한 더미는 몇 개인가요?
  answer: 두 개입니다. 기준범주를 나머지 두 더미가0인 경우로 표현합니다. 세 더미의 합은 절편 열과 같으므로 세 개 모두 넣으면 중복입니다.
- id: Q10
  question: 학력×관리직 모형에서 학사 관리직 격차는 어떤 계수 조합인가요?
  answer: bM+bE2M입니다. 대학원 기준 관리직 격차와 학사의 추가 격차를 합칩니다. 이번 모형에서 경력 기울기는 모든 집단 공통 bX입니다.
