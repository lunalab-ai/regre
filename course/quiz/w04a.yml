source: course/notion/w04a/w04a-prediction.md
provenance: W04A 본문 점검 퀴즈와 동일 문항. 학생 자가 점검 해설이며 실습 완전 풀이와 분리.
items:
- question: 평균반응의 신뢰구간과 새 관측의 예측구간은 무엇을 각각 포함하려는가?
  answer: 같은 x에서의 모집단 평균반응과, 같은 모형에서 독립적으로 얻는 새 관측 한 건을 각각 대상으로 한다. 같은 점예측을 사용해도 포함하려는 대상과 불확실성은 다르다. 계수 신뢰구간도 별개의 대상이다.
- question: 같은 x와 신뢰수준에서 예측구간이 더 넓은 이유는 무엇인가?
  answer: 평균 직선의 추정 오차에 새 관측 자체의 오차분산이 더해지기 때문이다. 평균 표준오차의 제곱근 안 h0에 1이 추가된다. 이는 새 오차가 독립이며 같은 분산이라는 모형 조건 아래의 계산이다.
- question: 평균반응 구간이 가장 좁아지는 x 위치는 어디이며, 외삽 계산은 무엇을 보장하지 못하는가?
  answer: 관측 X의 표본평균에서 가장 좁다. 그 위치에서 평균 X와의 거리 제곱 항이 0이다. 관측 범위 밖에서도 수치 계산은 가능하지만 선형 평균과 등분산 등 가정이 그곳에서도 성립함을 보장하지 못한다.
- question: SST=SSR+SSE가 성립하는 이번 최소제곱모형의 중요한 조건은 무엇인가?
  answer: 같은 자료에 절편을 포함하여 일반적인 비가중 최소제곱으로 적합한 조건이다. 잔차합과 X-잔차 내적이 0이어서 교차항의 합이 사라진다. 한 점마다 제곱된 편차가 그대로 더해지는 것은 아니며, 정규성은 이 대수적 분해 자체의 필수 조건이 아니다.
- question: 절편 포함 단순회귀의 R²와 상관계수 r은 어떤 관계이며, R²가 크면 인과관계가 증명되는가?
  answer: 반응과 예측변수에 변동이 있는 절편 포함 단순 OLS에서 R²=r²다. R²에는 관계 방향의 부호가 없다. 큰 값은 학습 자료의 평균 기준 변동을 많이 설명한다는 뜻이며 인과관계나 새 자료 예측성능을 증명하지 않는다.
- question: 원점 회귀의 잔차 자유도는 얼마이며, 잔차합은 반드시 0인가?
  answer: 기울기 하나를 추정하므로 유효한 모형에서 n-1이다. X와 잔차의 내적은 0이지만 잔차합이 0일 필요는 없다. 평균점을 지난다는 성질도 보장되지 않는다.
- question: 원점 회귀의 R 기본 R²와 절편 포함 모형의 R²를 그대로 크기 비교하면 안 되는 이유는 무엇인가?
  answer: 원점 모형의 분모는 관측 Y의 제곱합인 0 기준이고, 절편 포함 모형은 Y와 표본평균 차이의 제곱합인 평균 기준이다. 기준이 다른 비율을 직접 비교하면 제약으로 SSE가 증가했는데도 더 좋아졌다고 오해할 수 있다. 같은 기준·자료의 비교와 원점 제약의 실질적 근거가 필요하다.
- question: lm(y ~ 1)의 절편 추정값은 무엇이며, 대응표본 t 검정과는 어떻게 연결되는가?
  answer: 절편은 표본평균이다. 표준오차는 표본표준편차를 표본수의 제곱근으로 나눈 값이며 기본 계수 t 검정은 평균 0을 검정한다. 대응표본은 같은 대상의 전후 차이를 먼저 정의한 뒤 그 차이의 평균 모형을 쓰면 같은 t 검정으로 연결된다. 차이의 부호와 대립가설을 먼저 정한다.
