title: W11B · 지시변수 응용 점검
provenance: 새로 작성한 Q01–Q06의 학생용 개념 해설이며 교재 장말·실습 완성 풀이와 구별합니다.
source: course/notion/w11b/w11b-checkpoints.md
items:
- id: Q01
  question: C를 기준으로 A/B 더미가 모두0인 행의 평균은 무엇을 통해 표현되는가?
  answer: 절편이 기준 C평균을 담당합니다. 자체 예에서는9이며 관측이 삭제되거나 평균이0이 되는 것이 아닙니다.
- id: Q02
  question: 자체9개 예에서 SSE제한30, SSE전체6, 계수1→3이다. q·분모df·F를 구하라.
  answer: $q=2$, 분모df $9-3=6$, $F=((30-6)/2)/(6/6)=12$입니다. 증가분과 오차를 서로의 자유도로 나눕니다.
- id: Q03
  question: 스키40행에서 PDI만의2계수 모형에 분기 세 차이를 더하면 q와 분모df는?
  answer: 전체5계수이므로q3, 분모df35입니다. 분기를 숫자 한 열로 넣는3계수 모형과 다릅니다.
- id: Q04
  question: 교육비의 전체 연도별 모형은 왜12계수이고 안정성 제약은8개인가?
  answer: 기준식의 절편/세 기울기4개, 두 연도의 절편 차이2개와 기울기 차이6개입니다. 추가8개를0으로 두면 공통4계수 식이 됩니다.
- id: Q05
  question: 기준1975→1960 변경과 식의 *→+ 변경은 적합값에 각각 어떤 영향을 주는가?
  answer: 기준만 바꾸는 것은 같은 열공간의 다른 표현이므로 적합값은 같습니다. *→+는 기울기 곱항을 제거하는 다른 제약이므로 적합값과 SSE가
    바뀔 수 있습니다.
- id: Q06
  question: 같은150행이면 고전적 F검정의 모든 조건이 충족되는가?
  answer: 아닙니다. 같은 행·반응값·순서와 모형 중첩이 필요하고, 정확한 고전적 F분포에는 독립·동분산·정규오차 가정도 필요합니다. 반복
    주 관측이나 시간상관은 별도로 검토합니다.
