source: course/notion/w02b/w02b-r-syntax-2.md
provenance: 이번 차시 본문의 점검 퀴즈. 학생 공개용 해설이며 실습 전체 풀이와 구분합니다.
items:
  - question: 행렬과 데이터프레임의 자료형 규칙은 어떻게 다른가요?
    answer: 행렬은 모든 칸이 한 자료형으로 강제되지만 데이터프레임은 열마다 서로 다른 자료형을 가질 수 있습니다.
  - question: 리스트가 이후 회귀모형 결과를 이해하는 데 도움이 되는 이유는 무엇인가요?
    answer: 리스트는 계수, 잔차, 적합값처럼 서로 다른 형태의 객체를 이름 붙여 한 객체에 묶을 수 있으며 R의 모형 결과가 이런 구조를 사용하기 때문입니다.
  - question: "요인의 값과 `levels`는 어떻게 다른가요?"
    answer: 값은 각 관측의 범주이고 levels는 그 변수가 가질 수 있는 범주의 집합과 순서입니다.
  - question: "`install.packages()`와 `library()`는 각각 언제 사용하나요?"
    answer: install.packages()는 패키지를 PC 라이브러리에 설치할 때 보통 한 번 사용하고 library()는 현재 R 세션에서 설치된 패키지를 사용할 때 실행합니다.
  - question: "CSV를 읽은 직후 `str()`와 결측 개수를 확인하는 이유는 무엇인가요?"
    answer: 파일이 열려도 열 자료형이나 결측 표현이 잘못 해석될 수 있으므로 계산 전에 구조와 누락 상태를 확인해야 합니다.
  - question: "벡터 조건에서 `&`와 `&&`는 어떻게 다른가요?"
    answer: "&는 각 원소를 위치별로 비교하고 &&는 첫 원소만 사용하여 하나의 논리 판단을 만들므로 주로 if 조건에 사용합니다."
  - question: "`if` 조건이 `NA`가 되지 않도록 어떤 검사를 먼저 할 수 있나요?"
    answer: is.na()로 결측 여부를 먼저 분기하거나 length()로 입력이 비어 있지 않은지 확인할 수 있습니다.
  - question: 반복문과 벡터 연산의 결과가 같은지 어떤 코드로 검증할 수 있나요?
    answer: stopifnot(identical(loop_result, vector_result))처럼 동일성을 검사하여 다르면 즉시 멈추게 할 수 있습니다.
  - question: "`apply(X, 1, mean)`과 `apply(X, 2, mean)`은 각각 어느 방향을 계산하나요?"
    answer: MARGIN 1은 각 행, MARGIN 2는 각 열에 함수를 적용합니다.
  - question: 앱에서 임계값을 바꾸는 것은 원자료를 바꾸는 것인가요, 분류 규칙을 바꾸는 것인가요?
    answer: 원자료는 그대로 두고 fast와 slow를 나누는 분류 규칙만 바꿉니다.
