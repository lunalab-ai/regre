source: course/notion/w09b/w09b-workbook.md
provenance: W09B 기록지의 Q01–Q10 원문과 대응하는 별도 개념 해설. L01–L12의 완성 풀이와 구별함.
items:
- question: 오차와 잔차는 같은 관측 가능한 양인가?
  answer: 다릅니다. $\varepsilon_i$는 참 조건부 평균으로부터의 오차이고, $e_i=y_i-\hat y_i$는 자료로 추정한 적합값과의
    차이입니다. 잔차합 0은 절편 포함 OLS의 대수적 성질이며 조건부 오차 평균 가정의 입증이 아닙니다.
- question: 정규성 가정은 설명변수나 반응변수의 주변 분포에 관한 주장인가?
  answer: 아닙니다. 정확한 소표본 t/F 추론의 정규성은 주어진 $X$에서 오차의 조건부 분포에 관한 가정입니다. 잔차 Q-Q는 이를 살펴보는
    단서이며 주변 $X$ 또는 $Y$의 정규성을 요구하는 주장이 아닙니다.
- question: 높은 지레값은 반드시 큰 Cook의 거리를 뜻하는가?
  answer: 아닙니다. $C_i=(r_i^2/k)h_i/(1-h_i)$이므로 지레값과 잔차가 함께 관여합니다. 지레값이 높아도 잔차가 작으면
    Cook이 작을 수 있습니다. 영향력은 해당 모형과 비교 결과에 대해 읽습니다.
- question: 잔차가 0인 관측의 Hadi 성분은 모두 0인가?
  answer: 아닙니다. $e_i=0$이면 잔차 성분 $R_i$는 0이지만, $h_i>0$이면 잠재성 성분 $P_i=h_i/(1-h_i)$가 남습니다.
    따라서 $H_i=P_i+R_i$가 0일 필요가 없습니다. $h_i=1$인 경계는 별도로 정의 불가 상태를 확인합니다.
- question: 가면문제와 수렁문제는 무엇이 다른가?
  answer: 가면은 살펴볼 특이 관측을 놓치는 경우이고, 수렁은 특이하지 않은 관측을 특이하다고 잘못 표시하는 경우입니다. 일부 관측이 적합을
    당기고 서로 가릴 수 있으므로 잔차·지레값·영향력·내용 근거를 함께 검토합니다.
- question: 첨가변수플롯에서는 왜 두 축을 같은 다른 변수에 대해 잔차화하는가?
  answer: 다른 변수의 선형 부분을 양쪽에서 같은 조건으로 제거해 관심 변수에 남은 변동과 반응에 남은 변동을 비교하기 위해서입니다. 같은
    행의 두 잔차 기울기는 전체 모형의 해당 계수와 일치합니다. 한쪽만 제거하면 그 계산이 아닙니다.
- question: 성분잔차플롯의 가로·세로축은 무엇인가?
  answer: 가로축은 원래 $x_j$, 세로축은 $e+b_jx_j$입니다. 세로축은 실제 반응값이 아니라 진단용 성분잔차입니다. 두 축을 모두
    잔차화하는 첨가변수도와 구별합니다.
- question: 새 변수의 유의성과 기존 계수의 변화는 같은 검정인가?
  answer: 다른 질문입니다. 새 계수의 t검정은 그 모형에서 새 계수가 0인지에 관한 것이고, 기존 계수의 변화는 조건과 모형 변경의 민감도에
    관한 것입니다. 두 모형의 p값을 비교해 계수 차이 검정으로 대신하거나 인과를 단정하지 않습니다.
- question: 지수성장 그림의 큰 두 관측을 자동 삭제해도 되는가?
  answer: 자동 삭제할 수 없습니다. 교재 그림5.9의 큰 관측은 지수성장이라는 평균 형태의 중요한 정보를 담을 수 있습니다. 측정 오류·모집단·평균식
    등을 조사하고 원자료를 보존하며 조치 근거를 남깁니다.
- question: Huber M 적합은 모든 높은 지레점을 자동으로 낮은 가중치로 처리하는가?
  answer: 아닙니다. 이번 Huber M의 상대 가중치는 적합 잔차에 기초합니다. 높은 지레값 자체가 모두 낮은 가중치를 받는 것은 아닙니다.
    수렴·가중치·방법의 한계를 확인하고 일반 lm t/F 또는 로버스트 표준오차와 구별합니다.
