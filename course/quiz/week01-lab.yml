source: labs/student/week01/week01_lab_student.qmd
provenance: 이전된 실습 노트북의 점검 퀴즈에 대응하는 학습용 해설입니다. 기존 교수자 해설 및 강의 설명을 바탕으로 정리했습니다.
items:
- question: RStudio의 역할로 가장 적절한 것은?
  answer: B. RStudio는 R 작업을 통합하는 개발 환경입니다.
- question: Quarto `.qmd` 문서의 가장 중요한 목적은?
  answer: C. 설명·코드·실행 결과를 함께 기록하는 문서입니다.
- question: 컴퓨터 수리시간 데이터에서 반응변수와 설명변수를 쓰세요.
  answer: Y는 Minutes, X는 Units입니다.
- question: '$\varepsilon$가 필요한 이유를 한 문장으로 설명하세요.'
  answer: 모형이 모든 요인과 우연한 변동을 완전히 설명하지 못하기 때문입니다.
- question: '`file.path("data", "Computer.Repair.txt")`를 쓰는 주된 이유는?'
  answer: B. 운영체제와 프로젝트 구조에 맞는 상대경로를 만들기 위해서입니다.
- question: '`str(repair)`에서 확인할 수 있는 정보를 두 가지 쓰세요.'
  answer: 객체 구조, 변수명, 자료형, 행/열 수, 일부 값 등을 확인할 수 있습니다.
- question: 회귀분석을 반복적 과정이라고 하는 이유는?
  answer: B. 모형 진단·평가 결과에 따라 변수, 가정과 모형을 수정하기 때문입니다.
- question: 오늘 실행한 앱에서 사용자 입력이 모형의 예측으로 연결되는 흐름을 한 문장으로 쓰세요.
  answer: 슬라이더 입력이 newdata로 predict()에 전달되고 예측값이 텍스트와 그림으로 렌더링됩니다.
