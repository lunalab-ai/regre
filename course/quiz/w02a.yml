source: course/notion/w02a/w02a-rstudio-r-basics.md
provenance: 이번 차시 본문의 점검 퀴즈. 학생 공개용 해설이며 실습 과제 전체 풀이와 구분합니다.
items:
- question: R과 RStudio는 각각 어떤 역할을 하나요?
  answer: R은 계산을 실행하는 언어·환경이고 RStudio는 코드를 작성·실행·관리하는 IDE입니다.
- question: Source 창에 코드를 저장하는 것과 실행하는 것은 어떻게 다른가요?
  answer: 저장은 코드 파일을 보관하고 실행은 R이 코드를 평가하여 객체와 출력을 만듭니다. 수정 후 저장만 해서는 결과가 갱신되지 않습니다.
- question: 출력 앞의 [1]과 minutes[1]에서 1은 각각 무엇을 뜻하나요?
  answer: 출력의 [1]은 그 줄에 표시된 첫 원소의 위치, minutes[1]은 벡터의 첫 원소를 선택하는 인덱스입니다.
- question: total_minutes를 계산한 뒤 units만 바꾸면 기존 total_minutes도 자동으로 바뀌나요?
  answer: 아닙니다. 대입 시 계산한 값이 보관됩니다. total_minutes 계산 줄을 다시 실행해야 합니다.
- question: c(10, "20", 30)의 자료형은 무엇이며 이유는 무엇인가요?
  answer: character입니다. 하나의 원자 벡터에 문자가 포함되어 숫자도 문자로 변환됩니다.
- question: 결측값 NA와 숫자 0은 어떻게 다르며 결측은 어떤 함수로 확인하나요?
  answer: NA는 알 수 없는 값이고 0은 알려진 수치입니다. is.na()로 확인합니다. 제외한 평균의 의미도 설명해야 합니다.
- question: demo[1, 2]와 demo$minutes는 각각 무엇을 선택하나요?
  answer: 첫 행 둘째 열의 값 20과 minutes 열 전체 벡터를 각각 선택합니다.
- question: 합성 자료의 산점도가 오른쪽 위로 향하면 인과관계가 증명되나요?
  answer: 아닙니다. 시각적 연관성만으로 인과관계를 증명하지 못합니다. 이 자료는 설명용 합성 자료입니다.
