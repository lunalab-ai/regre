source: course/notion/w05a/w05a-multiple-regression.md
provenance: 본문과 동일한 학생 자가 점검 8문항; 실습 완전 풀이와 분리.
items:
- question: 설명편차와 잔차는 각각 어느 두 값을 비교하는가?
  answer: 설명편차는 회귀 예측−표본평균, 잔차는 실제 관측−회귀 예측이다. 전자는 예측이 기준선에서 이동한 양이며 개별 오차 감소량 자체가
    아니다.
- question: R²=0.9를 평균 예측과 제곱오차를 포함해 설명하라.
  answer: 같은 학습 표본의 평균 예측 제곱오차에 비해 절편 포함 OLS의 제곱오차 합이90% 감소했다는 뜻이다. 네 점 예에서는8에서0.8로
    감소한다. 새 관측90%를 정확히 맞힌다는 뜻이 아니다.
- question: attitude의 한 행과 수치의 단위는 무엇인가?
  answer: 한 행은 부서 하나이고30개 부서가 있다. 수치는 해당 항목에 대한 긍정 응답 비율(%)이며 변화량은 퍼센트포인트로 읽는다. 개인의
    점수가 아니다.
- question: 다중회귀계수를 해석할 때 반드시 덧붙여야 하는 비교 조건은 무엇인가?
  answer: 모형 안의 다른 설명변수를 같은 값으로 유지한 조건이다. complaints가1%p 다른 조건을 비교하면 privileges가 같을
    때 예측 rating이약0.7803%p 높다. 인과효과를 보장하지 않는다.
- question: 최소제곱법이 최소화하는 양과 조정하는 대상은 무엇인가?
  answer: 관측 반응과 예측의 수직 잔차를 제곱해 합한 SSE를 최소화한다. 관측 자료를 바꾸는 것이 아니라 절편과 기울기들을 조정한다.
- question: 관측30개, 설명변수2개, 절편 포함 모형의 잔차 자유도는 얼마인가?
  answer: 설계행렬이 완전 열계수이면30−(2+1)=27이다. 잔차 분산 추정량은SSE/27이다. 설명변수 수2와 추정계수 수3을 구분한다.
- question: 두 잔차를 회귀한 기울기는 어떤 다중회귀계수와 연결되는가?
  answer: rating과 privileges를 각각 동일한 complaints에 절편 포함 회귀한 잔차를 만든 뒤 rating잔차를 privileges잔차에
    회귀하면, rating~complaints+privileges의 privileges계수약−0.0501598과 일치한다.
- question: 설명변수를 추가하여 학습 R²가 커지면 새 자료의 예측성능도 반드시 좋아지는가?
  answer: 아니다. 같은 행·반응의 중첩된 절편 포함 OLS는 새 계수를0으로 둘 수 있어 학습SSE가 증가하지 않는다. R²비감소는 이런
    적합 성질이며 표본 밖 성능이나 인과성의 증거가 아니다.
