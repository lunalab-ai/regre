<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550"><rect width="1120" height="550" fill="white"/><g font-family="Malgun Gothic, Arial, sans-serif"><text x="25" y="37" font-size="27" fill="#19324b" text-anchor="start">직선을 구한 다음에는 무엇을 할까?</text><text x="25" y="70" font-size="17" fill="#64748b" text-anchor="start">W03B 복습 → 주교재 3.8–3.12 마무리</text><rect x="25" y="115" width="330" height="155" rx="12" fill="#f5f8fc" stroke="#2864b4" stroke-width="2"/><text x="43" y="149" font-size="23" fill="#2864b4" text-anchor="start">출발: 계수 추론</text><text x="43" y="187" font-size="18" fill="#19324b" text-anchor="start">절편·기울기 추정</text><text x="43" y="217" font-size="18" fill="#19324b" text-anchor="start">잔차와 최소제곱</text><text x="43" y="247" font-size="18" fill="#19324b" text-anchor="start">계수 t 검정·신뢰구간</text><text x="385" y="200" font-size="40" fill="#19324b" text-anchor="middle">→</text><rect x="420" y="115" width="675" height="155" rx="12" fill="#f5f8fc" stroke="#168c82" stroke-width="2"/><text x="438" y="149" font-size="23" fill="#168c82" text-anchor="start">예측과 적합성</text><text x="438" y="187" font-size="18" fill="#19324b" text-anchor="start">3.8 평균반응 vs 새 관측</text><text x="438" y="217" font-size="18" fill="#19324b" text-anchor="start">3.9 평균 예측 기준에서 얼마나 개선했는가?</text><text x="438" y="247" font-size="18" fill="#19324b" text-anchor="start">구간의 대상과 R²의 분모를 먼저 확인</text><rect x="25" y="335" width="510" height="150" rx="12" fill="#f5f8fc" stroke="#d25340" stroke-width="2"/><text x="43" y="369" font-size="23" fill="#d25340" text-anchor="start">3.10 원점 회귀</text><text x="43" y="407" font-size="18" fill="#19324b" text-anchor="start">절편을 0으로 제한</text><text x="43" y="437" font-size="18" fill="#19324b" text-anchor="start">추정 대상: 기울기</text><rect x="575" y="335" width="520" height="150" rx="12" fill="#f5f8fc" stroke="#168c82" stroke-width="2"/><text x="593" y="369" font-size="23" fill="#168c82" text-anchor="start">3.11 절편만 모형</text><text x="593" y="407" font-size="18" fill="#19324b" text-anchor="start">기울기 없이 한 개 평균</text><text x="593" y="437" font-size="18" fill="#19324b" text-anchor="start">3.12 문헌 안내로 학습 연결</text></g></svg>