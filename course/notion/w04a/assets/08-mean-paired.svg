<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550"><rect width="1120" height="550" fill="white"/><g font-family="Malgun Gothic, Arial, sans-serif"><text x="25" y="37" font-size="27" fill="#19324b" text-anchor="start">설명변수가 없어도 평균을 추정하는 회귀모형이다</text><text x="25" y="70" font-size="17" fill="#64748b" text-anchor="start">한 개 상수를 추정 → 표본평균 → 일표본 t 검정 → 대응표본 차이로 확장</text><rect x="20" y="98" width="490" height="350" rx="12" fill="#f5f8fc"/><text x="38" y="129" font-size="21" fill="#19324b" text-anchor="start">합성 d = (1, 2, 3, 4)</text><line x1="85.0" y1="393.0" x2="85.0" y2="158.0" stroke="#dae3ed" stroke-width="1" stroke-dasharray=""/><line x1="85.0" y1="393.0" x2="480.0" y2="393.0" stroke="#dae3ed" stroke-width="1" stroke-dasharray=""/><text x="85.0" y="418.0" font-size="14" fill="#19324b" text-anchor="middle">0</text><text x="77.0" y="398.0" font-size="14" fill="#19324b" text-anchor="end">0</text><line x1="183.75" y1="393.0" x2="183.75" y2="158.0" stroke="#dae3ed" stroke-width="1" stroke-dasharray=""/><line x1="85.0" y1="334.25" x2="480.0" y2="334.25" stroke="#dae3ed" stroke-width="1" stroke-dasharray=""/><text x="183.75" y="418.0" font-size="14" fill="#19324b" text-anchor="middle">1.25</text><text x="77.0" y="339.25" font-size="14" fill="#19324b" text-anchor="end">1.25</text><line x1="282.5" y1="393.0" x2="282.5" y2="158.0" stroke="#dae3ed" stroke-width="1" stroke-dasharray=""/><line x1="85.0" y1="275.5" x2="480.0" y2="275.5" stroke="#dae3ed" stroke-width="1" stroke-dasharray=""/><text x="282.5" y="418.0" font-size="14" fill="#19324b" text-anchor="middle">2.5</text><text x="77.0" y="280.5" font-size="14" fill="#19324b" text-anchor="end">2.5</text><line x1="381.25" y1="393.0" x2="381.25" y2="158.0" stroke="#dae3ed" stroke-width="1" stroke-dasharray=""/><line x1="85.0" y1="216.75" x2="480.0" y2="216.75" stroke="#dae3ed" stroke-width="1" stroke-dasharray=""/><text x="381.25" y="418.0" font-size="14" fill="#19324b" text-anchor="middle">3.75</text><text x="77.0" y="221.75" font-size="14" fill="#19324b" text-anchor="end">3.75</text><line x1="480.0" y1="393.0" x2="480.0" y2="158.0" stroke="#dae3ed" stroke-width="1" stroke-dasharray=""/><line x1="85.0" y1="158.0" x2="480.0" y2="158.0" stroke="#dae3ed" stroke-width="1" stroke-dasharray=""/><text x="480.0" y="418.0" font-size="14" fill="#19324b" text-anchor="middle">5</text><text x="77.0" y="163.0" font-size="14" fill="#19324b" text-anchor="end">5</text><text x="265.0" y="438" font-size="16" fill="#19324b" text-anchor="middle">관측 번호</text><text x="36" y="152" font-size="14" fill="#19324b" text-anchor="start">차이</text><line x1="85.0" y1="275.5" x2="480.0" y2="275.5" stroke="#2864b4" stroke-width="3" stroke-dasharray=""/><circle cx="164.0" cy="346.0" r="5" fill="#19324b"/><circle cx="243.0" cy="299.0" r="5" fill="#19324b"/><circle cx="322.0" cy="252.0" r="5" fill="#19324b"/><circle cx="401.0" cy="205.0" r="5" fill="#19324b"/><rect x="555" y="110" width="540" height="145" rx="12" fill="#f5f8fc" stroke="#168c82" stroke-width="2"/><text x="573" y="144" font-size="23" fill="#168c82" text-anchor="start">짝의 차이를 먼저 정의</text><text x="573" y="182" font-size="18" fill="#19324b" text-anchor="start">같은 대상: before - after</text><text x="573" y="212" font-size="18" fill="#19324b" text-anchor="start">양수 = 처리시간 감소 (이 부호 정의에서)</text><text x="820" y="300" font-size="39" fill="#19324b" text-anchor="middle">↓</text><rect x="555" y="325" width="540" height="145" rx="12" fill="#f5f8fc" stroke="#2864b4" stroke-width="2"/><text x="573" y="359" font-size="23" fill="#2864b4" text-anchor="start">차이의 평균 모형</text><text x="573" y="397" font-size="18" fill="#19324b" text-anchor="start">lm(d ~ 1): 평균 차이 추정</text><text x="573" y="427" font-size="18" fill="#19324b" text-anchor="start">t.test(d, mu=0): 같은 평균 0 검정</text><text x="40" y="508" font-size="19" fill="#19324b" text-anchor="start">절편만 모형의 수평선 = 표본평균 · 정확한 t 추론은 차이의 정규성 등 가정 필요</text></g></svg>