<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550"><rect width="1120" height="550" fill="white"/><g font-family="Malgun Gothic, Arial, sans-serif"><text x="25" y="37" font-size="27" fill="#19324b" text-anchor="start">입력을 바꾸면 같은 모형에서 질문을 다시 계산한다</text><text x="25" y="70" font-size="17" fill="#64748b" text-anchor="start">L6: 새 kind_custom 선택 입력을 직접 추가하고 서버 참조 두 곳을 연결</text><rect x="25" y="130" width="280" height="165" rx="12" fill="#f5f8fc" stroke="#2864b4" stroke-width="2"/><text x="43" y="164" font-size="23" fill="#2864b4" text-anchor="start">UI 입력</text><text x="43" y="202" font-size="18" fill="#19324b" text-anchor="start">예측 위치</text><text x="43" y="232" font-size="18" fill="#19324b" text-anchor="start">구간 수준</text><text x="43" y="262" font-size="18" fill="#19324b" text-anchor="start">평균 / 새 관측</text><text x="350" y="215" font-size="40" fill="#19324b" text-anchor="middle">→</text><rect x="395" y="130" width="300" height="165" rx="12" fill="#f5f8fc" stroke="#168c82" stroke-width="2"/><text x="413" y="164" font-size="23" fill="#168c82" text-anchor="start">공통 계산</text><text x="413" y="202" font-size="18" fill="#19324b" text-anchor="start">interval_settings()</text><text x="413" y="232" font-size="18" fill="#19324b" text-anchor="start">prediction_intervals()</text><text x="413" y="262" font-size="18" fill="#19324b" text-anchor="start">모형 재적합 없음</text><text x="737" y="215" font-size="40" fill="#19324b" text-anchor="middle">→</text><rect x="780" y="130" width="315" height="165" rx="12" fill="#f5f8fc" stroke="#2864b4" stroke-width="2"/><text x="798" y="164" font-size="23" fill="#2864b4" text-anchor="start">결과 표시</text><text x="798" y="202" font-size="18" fill="#19324b" text-anchor="start">점예측·상하한 표</text><text x="798" y="232" font-size="18" fill="#19324b" text-anchor="start">점별 구간 그림</text><text x="798" y="262" font-size="18" fill="#19324b" text-anchor="start">외삽 여부 안내</text><rect x="25" y="360" width="1070" height="125" rx="12" fill="#f5f8fc" stroke="#2864b4" stroke-width="2"/><text x="43" y="394" font-size="23" fill="#2864b4" text-anchor="start">직접 수정하고 Re-run app</text><text x="43" y="432" font-size="18" fill="#19324b" text-anchor="start">새 UI의 ID와 서버의 input 이름을 일치시킨다. 기존 입력과 새 입력의 작동 차이를 확인한다.</text><text x="43" y="462" font-size="18" fill="#19324b" text-anchor="start">이전 기능 유지: 계수 추론 · 관계 탐색 · 첫 회귀 예측 · R 문법 실험실</text></g></svg>