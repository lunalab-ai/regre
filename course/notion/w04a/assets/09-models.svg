<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550"><rect width="1120" height="550" fill="white"/><g font-family="Malgun Gothic, Arial, sans-serif"><text x="25" y="37" font-size="27" fill="#19324b" text-anchor="start">계수 수가 같아도 같은 모형은 아니다</text><text x="25" y="70" font-size="17" fill="#64748b" text-anchor="start">R formula를 식과 함께 읽기</text><rect x="25" y="120" width="345" height="330" rx="12" fill="#f5f8fc" stroke="#2864b4" stroke-width="2"/><text x="43" y="154" font-size="23" fill="#2864b4" text-anchor="start">절편 포함</text><text x="43" y="192" font-size="18" fill="#19324b" text-anchor="start">Minutes ~ Units</text><text x="43" y="222" font-size="18" fill="#19324b" text-anchor="start"></text><text x="43" y="252" font-size="18" fill="#19324b" text-anchor="start">절편과 기울기</text><text x="43" y="282" font-size="18" fill="#19324b" text-anchor="start">2개 계수 · df=n-2</text><text x="43" y="312" font-size="18" fill="#19324b" text-anchor="start">평균 기준 R²</text><text x="43" y="342" font-size="18" fill="#19324b" text-anchor="start">평균점을 지나는 직선</text><rect x="390" y="120" width="345" height="330" rx="12" fill="#f5f8fc" stroke="#d25340" stroke-width="2"/><text x="408" y="154" font-size="23" fill="#d25340" text-anchor="start">원점 회귀</text><text x="408" y="192" font-size="18" fill="#19324b" text-anchor="start">Minutes ~ 0 + Units</text><text x="408" y="222" font-size="18" fill="#19324b" text-anchor="start"></text><text x="408" y="252" font-size="18" fill="#19324b" text-anchor="start">원점 제약의 기울기</text><text x="408" y="282" font-size="18" fill="#19324b" text-anchor="start">1개 계수 · df=n-1</text><text x="408" y="312" font-size="18" fill="#19324b" text-anchor="start">0 기준 R²</text><text x="408" y="342" font-size="18" fill="#19324b" text-anchor="start">잔차합 0 보장 없음</text><rect x="755" y="120" width="340" height="330" rx="12" fill="#f5f8fc" stroke="#168c82" stroke-width="2"/><text x="773" y="154" font-size="23" fill="#168c82" text-anchor="start">절편만 모형</text><text x="773" y="192" font-size="18" fill="#19324b" text-anchor="start">Minutes ~ 1</text><text x="773" y="222" font-size="18" fill="#19324b" text-anchor="start"></text><text x="773" y="252" font-size="18" fill="#19324b" text-anchor="start">공통 평균</text><text x="773" y="282" font-size="18" fill="#19324b" text-anchor="start">1개 계수 · df=n-1</text><text x="773" y="312" font-size="18" fill="#19324b" text-anchor="start">평균 기준 R²</text><text x="773" y="342" font-size="18" fill="#19324b" text-anchor="start">수평선</text><text x="560" y="515" font-size="21" fill="#19324b" text-anchor="middle">모형 제약 → 추정 대상 → 자유도 → 출력의 기준 순서로 읽는다.</text></g></svg>