<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550"><rect width="1120" height="550" fill="white"/><g font-family="Malgun Gothic, Arial, sans-serif"><text x="25" y="37" font-size="27" fill="#19324b" text-anchor="start">한 관측의 전체 편차 = 설명 편차 + 잔차</text><text x="25" y="70" font-size="17" fill="#64748b" text-anchor="start">실제 관측 x=10, y=166 · 각 항의 부호를 포함한 수직 차이</text><line x1="85" y1="154.59999999999997" x2="1020" y2="154.59999999999997" stroke="#b9c7d7" stroke-width="1" stroke-dasharray="5 4"/><text x="1020" y="144.59999999999997" font-size="19" fill="#19324b" text-anchor="end">관측 y = 166.000</text><line x1="85" y1="182.61510025062648" x2="1020" y2="182.61510025062648" stroke="#b9c7d7" stroke-width="1" stroke-dasharray="5 4"/><text x="1020" y="172.61510025062648" font-size="19" fill="#19324b" text-anchor="end">적합값 = 159.249</text><line x1="85" y1="440.0607142857143" x2="1020" y2="440.0607142857143" stroke="#b9c7d7" stroke-width="1" stroke-dasharray="5 4"/><text x="1020" y="430.0607142857143" font-size="19" fill="#19324b" text-anchor="end">평균 = 97.214</text><line x1="160" y1="440.0607142857143" x2="160" y2="154.59999999999997" stroke="#19324b" stroke-width="7" stroke-dasharray=""/><circle cx="160" cy="440.0607142857143" r="5" fill="#19324b"/><circle cx="160" cy="154.59999999999997" r="5" fill="#19324b"/><text x="178" y="297.3303571428571" font-size="18" fill="#19324b" text-anchor="start">전체 편차 68.786</text><line x1="430" y1="440.0607142857143" x2="430" y2="182.61510025062648" stroke="#2864b4" stroke-width="7" stroke-dasharray=""/><circle cx="430" cy="440.0607142857143" r="5" fill="#2864b4"/><circle cx="430" cy="182.61510025062648" r="5" fill="#2864b4"/><text x="448" y="311.3379072681704" font-size="18" fill="#2864b4" text-anchor="start">설명 편차 62.035</text><line x1="700" y1="182.61510025062648" x2="700" y2="154.59999999999997" stroke="#d25340" stroke-width="7" stroke-dasharray=""/><circle cx="700" cy="182.61510025062648" r="5" fill="#d2