<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280"><rect width="900" height="280" fill="white"/><g font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" fill="#18304b"><text x="30" y="45" font-size="25" font-weight="bold">벡터를 열로 묶으면 표가 됩니다</text><rect x="25" y="90" width="265" height="115" rx="12" fill="#e9f2ff" stroke="#2860a0"/><text x="157" y="132" text-anchor="middle" font-size="21" font-weight="bold">units</text><text x="157" y="173" text-anchor="middle" font-size="16">1  2  3  4  5  6</text><text x="302" y="153" font-size="22">→</text><rect x="315" y="90" width="265" height="115" rx="12" fill="#e9f2ff" stroke="#2860a0"/><text x="447" y="132" text-anchor="middle" font-size="21" font-weight="bold">minutes</text><text x="447" y="173" text-anchor="middle" font-size="16">20 30 35 45 50 60</text><text x="592" y="153" font-size="22">→</text><rect x="605" y="90" width="265" height="115" rx="12" fill="#e9f2ff" stroke="#2860a0"/><text x="737" y="132" text-anchor="middle" font-size="21" font-weight="bold">data.frame</text><text x="737" y="173" text-anchor="middle" font-size="16">6행 × 2열</text><text x="30" y="251" font-size="17">각 행은 하나의 관측, 각 열은 하나의 변수입니다. 합성 자료 예시입니다.</text></g></svg>