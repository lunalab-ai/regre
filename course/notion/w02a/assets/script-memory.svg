<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280"><rect width="900" height="280" fill="white"/><g font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" fill="#18304b"><text x="30" y="45" font-size="25" font-weight="bold">저장과 실행은 서로 다릅니다</text><rect x="25" y="90" width="265" height="115" rx="12" fill="#e9f2ff" stroke="#2860a0"/><text x="157" y="132" text-anchor="middle" font-size="21" font-weight="bold">스크립트 .R</text><text x="157" y="173" text-anchor="middle" font-size="16">디스크에 코드 보관</text><text x="302" y="153" font-size="22">→</text><rect x="315" y="90" width="265" height="115" rx="12" fill="#e9f2ff" stroke="#2860a0"/><text x="447" y="132" text-anchor="middle" font-size="21" font-weight="bold">실행</text><text x="447" y="173" text-anchor="middle" font-size="16">Ctrl+Enter / Cmd+Enter</text><text x="592" y="153" font-size="22">→</text><rect x="605" y="90" width="265" height="115" rx="12" fill="#e9f2ff" stroke="#2860a0"/><text x="737" y="132" text-anchor="middle" font-size="21" font-weight="bold">R 메모리</text><text x="737" y="173" text-anchor="middle" font-size="16">객체와 계산 결과</text><text x="30" y="251" font-size="17">재시작 후에는 저장한 코드를 다시 실행하여 객체를 만듭니다.</text></g></svg>