<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560"><rect width="1120" height="560" fill="white"/><g font-family="Malgun Gothic, Arial, sans-serif"><text x="24" y="37" fill="#19324b" font-size="26" text-anchor="start">함께 변한다 ≠ 한 변수가 다른 변수를 일으킨다</text><text x="24" y="65" fill="#52667c" font-size="16" text-anchor="start">가상의 설명 도식 · 실제 인과효과를 추정한 자료가 아님</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#52667c"/></marker></defs><rect x="390" y="110" width="340" height="95" rx="18" fill="#eaf2fc" stroke="#a9bfd8"/><text x="560.0" y="168" fill="#19324b" font-size="25" text-anchor="middle">더운 날씨</text><rect x="80" y="330" width="390" height="95" rx="18" fill="#eaf2fc" stroke="#a9bfd8"/><text x="275.0" y="388" fill="#19324b" font-size="25" text-anchor="middle">아이스크림 판매 증가</text><rect x="650" y="330" width="390" height="95" rx="18" fill="#eaf2fc" stroke="#a9bfd8"/><text x="845.0" y="388" fill="#19324b" font-size="25" text-anchor="middle">물놀이 인구 증가</text><path d="M440,208 L280,318 M680,208 L845,318" stroke="#52667c" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="482" fill="#19324b" font-size="22" text-anchor="middle">두 결과의 동행만으로 직접적인 인과효과를 결론내릴 수 없다.</text></g></svg>