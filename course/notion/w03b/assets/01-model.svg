<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560"><rect width="1120" height="560" fill="white"/><g font-family="Malgun Gothic, Arial, sans-serif"><text x="24" y="36" font-size="27" fill="#19324b" text-anchor="start">모집단의 직선과 표본의 직선은 역할이 다르다</text><text x="24" y="66" font-size="17" fill="#52667c" text-anchor="start">모수는 알고 싶은 대상 · 추정값은 데이터로 계산한 결과</text><rect x="25" y="110" width="490" height="150" rx="12" fill="#f5f8fc" stroke="#2864b4" stroke-width="2"/><text x="43" y="143" font-size="23" fill="#2864b4" text-anchor="start">모집단 모형</text><text x="43" y="178" font-size="18" fill="#19324b" text-anchor="start">평균 경향: 절편 + 기울기 × X</text><text x="43" y="208" font-size="18" fill="#19324b" text-anchor="start">관측의 변동: 평균 경향 + 확률오차</text><text x="43" y="238" font-size="18" fill="#19324b" text-anchor="start">참 계수와 참 오차는 직접 알 수 없음</text><rect x="605" y="110" width="490" height="150" rx="12" fill="#f5f8fc" stroke="#168c82" stroke-width="2"/><text x="623" y="143" font-size="23" fill="#168c82" text-anchor="start">표본으로 적합</text><text x="623" y="178" font-size="18" fill="#19324b" text-anchor="start">관측 자료로 절편·기울기를 추정</text><text x="623" y="208" font-size="18" fill="#19324b" text-anchor="start">적합값: 추정한 직선의 높이</text><text x="623" y="238" font-size="18" fill="#19324b" text-anchor="start">잔차: 실제 관측값 - 적합값</text><text x="560" y="193" font-size="44" fill="#19324b" text-anchor="middle">→</text><rect x="25" y="320" width="1070" height="150" rx="12" fill="#f5f8fc" stroke="#2864b4" stroke-width="2"/><text x="43" y="353" font-size="23" fill="#2864b4" text-anchor="start">같은 X에서도 Y는 다를 수 있다</text><text x="43" y="388" font-size="18" fill="#19324b" text-anchor="start">오차: 모르는 모집단 평균을 기준으로 한 차이</text><text x="43" y="418" font-size="18" fill="#19324b" text-anchor="start">잔차: 데이터로 구한 평균 직선을 기준으로 계산한 차이</text><text x="43" y="448" font-size="18" fill="#19324b" text-anchor="start">표본을 새로 얻으면 추정 직선과 잔차도 달라진다.</text></g></svg>