<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560"><rect width="1120" height="560" fill="white"/><g font-family="Malgun Gothic, Arial, sans-serif"><text x="24" y="36" font-size="27" fill="#19324b" text-anchor="start">같은 lm 객체에서 필요한 결과를 꺼낸다</text><text x="24" y="66" font-size="17" fill="#52667c" text-anchor="start">lm은 적합 · 나머지는 적합 결과의 접근·요약</text><rect x="30" y="120" width="285" height="125" rx="12" fill="#f5f8fc" stroke="#2864b4" stroke-width="2"/><text x="48" y="153" font-size="23" fill="#2864b4" text-anchor="start">repair 데이터</text><text x="48" y="188" font-size="18" fill="#19324b" text-anchor="start">Units: 예측변수</text><text x="48" y="218" font-size="18" fill="#19324b" text-anchor="start">Minutes: 반응변수</text><text x="350" y="190" font-size="42" fill="#19324b" text-anchor="middle">→</text><rect x="390" y="120" width="285" height="125" rx="12" fill="#f5f8fc" stroke="#168c82" stroke-width="2"/><text x="408" y="153" font-size="23" fill="#168c82" text-anchor="start">fit ← lm(...)</text><text x="408" y="188" font-size="18" fill="#19324b" text-anchor="start">절편과 기울기 추정</text><text x="408" y="218" font-size="18" fill="#19324b" text-anchor="start">관측 순서의 결과 보관</text><text x="710" y="190" font-size="42" fill="#19324b" text-anchor="middle">→</text><rect x="750" y="95" width="340" height="310" rx="12" fill="#f5f8fc" stroke="#2864b4" stroke-width="2"/><text x="768" y="128" font-size="23" fill="#2864b4" text-anchor="start">결과 읽기</text><text x="768" y="163" font-size="18" fill="#19324b" text-anchor="start">coef: 계수 2개</text><text x="768" y="193" font-size="18" fill="#19324b" text-anchor="start">fitted: 적합값 14개</text><text x="768" y="223" font-size="18" fill="#19324b" text-anchor="start">residuals: 잔차 14개</text><text x="768" y="253" font-size="18" fill="#19324b" text-anchor="start">summary: 추정 / SE / t / p</text><text x="768" y="283" font-size="18" fill="#19324b" text-anchor="start">confint: 계수별 하한·상한</text><text x="40" y="475" font-size="22" fill="#19324b" text-anchor="start">Minutes ~ Units: 왼쪽은 반응변수 · 오른쪽은 예측변수 · 기본 절편 포함</text></g></svg>