<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560"><rect width="1120" height="560" fill="white"/><g font-family="Malgun Gothic, Arial, sans-serif"><text x="24" y="36" font-size="27" fill="#19324b" text-anchor="start">한 번 적합한 모형을 설정과 연결해 웹앱을 확장한다</text><text x="24" y="66" font-size="17" fill="#52667c" text-anchor="start">학생 활동: 새 ci_custom 입력 추가 → 서버의 두 입력 참조 연결 → 표·구간 확인</text><rect x="25" y="125" width="285" height="155" rx="12" fill="#f5f8fc" stroke="#2864b4" stroke-width="2"/><text x="43" y="158" font-size="23" fill="#2864b4" text-anchor="start">UI 입력</text><text x="43" y="193" font-size="18" fill="#19324b" text-anchor="start">신뢰수준 90 / 95 / 99%</text><text x="43" y="223" font-size="18" fill="#19324b" text-anchor="start">귀무 기울기 0 / 12 / ...</text><text x="43" y="253" font-size="18" fill="#19324b" text-anchor="start">입력 ID를 서버와 일치</text><text x="350" y="220" font-size="42" fill="#19324b" text-anchor="middle">→</text><rect x="390" y="125" width="305" height="155" rx="12" fill="#f5f8fc" stroke="#168c82" stroke-width="2"/><text x="408" y="158" font-size="23" fill="#168c82" text-anchor="start">공통 계산</text><text x="408" y="193" font-size="18" fill="#19324b" text-anchor="start">inference_settings()</text><text x="408" y="223" font-size="18" fill="#19324b" text-anchor="start">coefficient_inference(model,</text><text x="408" y="253" font-size="18" fill="#19324b" text-anchor="start">  level, null_slope)</text><text x="730" y="220" font-size="42" fill="#19324b" text-anchor="middle">→</text><rect x="770" y="125" width="325" height="155" rx="12" fill="#f5f8fc" stroke="#2864b4" stroke-width="2"/><text x="788" y="158" font-size="23" fill="#2864b4" text-anchor="start">연결된 결과</text><text x="788" y="193" font-size="18" fill="#19324b" text-anchor="start">계수·SE·t·p 표</text><text x="788" y="223" font-size="18" fill="#19324b" text-anchor="start">기울기 신뢰구간 그림</text><text x="788" y="253" font-size="18" fill="#19324b" text-anchor="start">수준과 기각 여부 안내</text><rect x="25" y="350" width="1070" height="125" rx="12" fill="#f5f8fc" stroke="#2864b4" stroke-width="2"/><text x="43" y="383" font-size="23" fill="#2864b4" text-anchor="start">유지되는 것 / 달라지는 것</text><text x="43" y="418" font-size="18" fill="#19324b" text-anchor="start">고정: 같은 데이터, 적합계수, 표준오차 · 변경: 기준값에 따른 검정, 신뢰수준에 따른 구간</text><text x="43" y="448" font-size="18" fill="#19324b" text-anchor="start">이전 탭 유지: 관계 탐색 · 첫 회귀 예측 · R 문법 실험실</text></g></svg>