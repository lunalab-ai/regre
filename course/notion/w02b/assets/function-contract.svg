<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><rect width="1200" height="360" fill="#f6f8fc"/><g font-family="Malgun Gothic,Arial,sans-serif" fill="#172554"><text x="35" y="45" font-size="26" font-weight="bold">R 함수: 입력을 받아 새 결과 반환</text><rect x="35" y="76" width="350" height="215" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="55" y="111" font-size="22" font-weight="bold">입력 값</text><text x="55" y="153" font-size="19">minutes = c(30,50,NA)</text><text x="55" y="184" font-size="19">threshold = 45</text><text x="55" y="215" font-size="19">숫자 3개와 기준 1개</text><text x="55" y="246" font-size="19">source()는 먼저 정의를 읽음</text><text x="394" y="190" font-size="30">→</text><rect x="425" y="76" width="350" height="215" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="445" y="111" font-size="22" font-weight="bold">classify_minutes 호출</text><text x="445" y="153" font-size="19">결측이면 missing</text><text x="445" y="184" font-size="19">45 이하이면 fast</text><text x="445" y="215" font-size="19">45 초과이면 slow</text><text x="445" y="246" font-size="19">원본 minutes는 변경 안 함</text><text x="784" y="190" font-size="30">→</text><rect x="815" y="76" width="350" height="215" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="835" y="111" font-size="22" font-weight="bold">반환값과 표시</text><text x="835" y="153" font-size="19">fast / slow / missing</text><text x="835" y="184" font-size="19">길이 3의 ordered factor</text><text x="835" y="215" font-size="19">missing은 실제 NA가 아님</text><text x="835" y="246" font-size="19">table()과 앱 그림에 재사용</text><text x="35" y="333" font-size="18">직접 설계한 코드 흐름도 · 기준을 55로 바꾸면 50분의 범주만 fast로 바뀐다.</text></g></svg>