<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320"><rect width="1000" height="320" fill="#fbfcff"/><g font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" fill="#18304b"><text x="40" y="52" font-size="28" font-weight="700">값을 담는 모양이 계산 방법을 결정합니다</text><rect x="40" y="92" width="270" height="135" rx="16" fill="#e8f1ff" stroke="#315b7d" stroke-width="2"/><text x="175.0" y="139" text-anchor="middle" font-size="23" font-weight="700">행렬</text><text x="175.0" y="181" text-anchor="middle" font-size="17">한 자료형 · 행×열</text><text x="326" y="167" font-size="30">→</text><rect x="365" y="92" width="270" height="135" rx="16" fill="#e8f8f1" stroke="#315b7d" stroke-width="2"/><text x="500.0" y="139" text-anchor="middle" font-size="23" font-weight="700">리스트</text><text x="500.0" y="181" text-anchor="middle" font-size="17">서로 다른 객체의 묶음</text><text x="651" y="167" font-size="30">→</text><rect x="690" y="92" width="270" height="135" rx="16" fill="#fff2df" stroke="#315b7d" stroke-width="2"/><text x="825.0" y="139" text-anchor="middle" font-size="23" font-weight="700">요인</text><text x="825.0" y="181" text-anchor="middle" font-size="17">범주 값 + 수준(levels)</text><text x="40" y="282" font-size="18">회귀분석에서는 설계행렬, 모형 결과 객체, 범주형 설명변수로 다시 만납니다.</text></g></svg>