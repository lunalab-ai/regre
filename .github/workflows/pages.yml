name: Deploy online R labs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML playwright pypdf
      - run: python -m playwright install --with-deps chromium
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
      - name: Install rendering and Shinylive tools
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libuv1-dev libarchive-dev libssl-dev
      - name: Install and verify R packages
        shell: Rscript {0}
        run: |
          required <- c("knitr", "rmarkdown", "shinylive")
          install.packages(required)
          stopifnot(all(vapply(required, requireNamespace, logical(1), quietly=TRUE)))
      - name: Check public sources
        run: |
          python scripts/validate_notion_bundle.py course/notion --strict
          python scripts/check_public_release.py .
      - name: Build browser lessons and app
        run: python scripts/browser_labs.py render
      - name: Execute browser R and editor tests
        run: python scripts/browser_labs.py check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: .build/browser-check.json
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: browser/_site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - run: echo "Published ${{ github.sha }} to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
